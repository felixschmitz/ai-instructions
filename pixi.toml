[workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "win-64", "linux-64"]

[dependencies]
pre-commit = ">=4.5"
python = ">=3.13"
pip = ">=24"
yamllint = ">=1.38"

[pypi-dependencies]
pyproject-fmt = ">=2.21"

[tasks]
check = "yamllint .pre-commit-config.yaml .yamllint.yml"
format = "pyproject-fmt pyproject.toml"
lint = "yamllint .pre-commit-config.yaml .yamllint.yml"
pre-commit = "pre-commit run --all-files"
